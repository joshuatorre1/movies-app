[versions]
agp = "9.3.2"
coil = "3.5.0"
coreKtx = "1.19.0"
dagger = "2.60.1"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.8.0"
